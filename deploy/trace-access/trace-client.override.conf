[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
User=rh-arbitrage
Group=rh-arbitrage
RuntimeDirectory=
RuntimeDirectory=rh-fullnode-trace
RuntimeDirectoryMode=0700
UMask=0077
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=true
# stunnel may chmod Unix listeners itself. Directory 0700 also protects startup;
# make the final socket mode explicit before systemd reports the unit ready.
ExecStartPost=/usr/bin/python3 -c 'import os,time; p="/run/rh-fullnode-trace/trace.sock"; [(time.sleep(0.05)) for _ in range(100) if not os.path.exists(p)]; os.chmod(p,0o600)'
